name: FreqBeacon Security Preview Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/freqbeacon-static-asset-lockdown-20261008]

permissions:
  contents: read

jobs:
  source-and-build:
    name: Source regressions and Cloudflare bundle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing security, catalog, health and compliance suites
        run: npm test
      - name: Verify Cloudflare package and static asset manifest generation
        run: npx --yes wrangler@4.92.0 deploy --dry-run --outdir ./security-build-proof

  deployed-preview:
    name: Test public preview GET and HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm blocked assets are not publicly retrievable
        env:
          BASE: https://audit-freqbeacon-static-asset-lockdown-20261008-signal-scout.james-methvin74.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          # Limited retries allow Cloudflare Git integration time to deploy this PR commit.
          for i in 1 2 3 4 5; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || true)"
            if [[ "$code" == "200" ]]; then break; fi
            echo "Preview root pending: attempt $i HTTP $code"
            sleep 15
          done
          [[ "$code" == "200" ]] || { echo "FAIL: preview homepage not available (HTTP $code)"; exit 1; }
          blocked=(
            '/worker-program-v22.js' '/worker-base.js' '/security-hardening.js'
            '/receiver-health-d1.js' '/receiver-health-backfill.js'
            '/kiwi-public-directory.js' '/sdr-ws-router.js'
            '/sdr-forensics-v4.html' '/sdr-forensics-v4.js'
            '/sdr-diagnostics.html' '/sdr-trace.html' '/sdr-trace-v2.html'
            '/pwa-diagnostics.html' '/pwa-check/index.html'
            '/scripts/generate-global-terrestrial-catalog.mjs'
            '/tests/security-hardening.test.mjs' '/package.json'
            '/SOURCE-COMPLIANCE.md' '/wrangler.jsonc' '/.assetsignore'
          )
          failures=0
          for path in "${blocked[@]}"; do
            for method in GET HEAD; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X "$method" "$BASE$path" || true)"
              echo "BLOCKED $method $path -> HTTP $status"
              if [[ ! "$status" =~ ^(403|404|410)$ ]]; then failures=$((failures+1)); fi
            done
          done
          allowed=('/' '/index.html' '/explore.html' '/lookup.html' '/freqbeacon-zero.html' '/app.js' '/explore-page.js' '/sdr-player.js' '/full-data.js' '/favicon.svg')
          for path in "${allowed[@]}"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE$path" || true)"
            echo "PUBLIC GET $path -> HTTP $status"
            if [[ "$status" != "200" ]]; then failures=$((failures+1)); fi
          done
          if ((failures)); then echo "FAIL: $failures security/availability checks"; exit 1; fi
          echo "PASS: 40 blocked GET/HEAD requests and 10 core public routes"
