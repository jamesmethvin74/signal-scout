name: FreqBeacon Security Preview Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-build:
    if: github.event_name == 'pull_request'
    name: Source regressions and Cloudflare bundle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing security, catalog, health and compliance suites
        run: |
          npm test
      - name: Check historical full test inventory for NEW failures only
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs > /tmp/freqbeacon-proposal-tests.txt 2>&1 || true
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach /tmp/freqbeacon-baseline FETCH_HEAD
          (cd /tmp/freqbeacon-baseline && node --test tests/*.test.mjs) > /tmp/freqbeacon-baseline-tests.txt 2>&1 || true
          sed -nE 's/^not ok [0-9]+ - //p' /tmp/freqbeacon-proposal-tests.txt | LC_ALL=C sort -u > /tmp/proposal-failures.txt
          sed -nE 's/^not ok [0-9]+ - //p' /tmp/freqbeacon-baseline-tests.txt | LC_ALL=C sort -u > /tmp/baseline-failures.txt
          echo "Historic full-suite failures on main: $(wc -l < /tmp/baseline-failures.txt)"
          echo "Historic full-suite failures on PR:   $(wc -l < /tmp/proposal-failures.txt)"
          comm -23 /tmp/proposal-failures.txt /tmp/baseline-failures.txt > /tmp/new-failures.txt
          if [[ -s /tmp/new-failures.txt ]]; then
            echo "FAIL: New full-suite regressions:"
            cat /tmp/new-failures.txt
            exit 1
          fi
          echo "PASS: No new failures beyond pre-existing main-branch test debt"
      - name: Verify Cloudflare package and static asset manifest generation
        run: |
          npx --yes wrangler@4.92.0 deploy --dry-run --outdir ./security-build-proof
          echo "Dry-run output artifact names:"
          find security-build-proof -maxdepth 2 -type f -printf '%P\\n' | head -40

  deployed-preview:
    if: github.event_name == 'pull_request'
    name: Test public preview GET and HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm blocked assets are not publicly retrievable
        shell: bash
        run: |
          set -euo pipefail
          # Test the current PR branch, never a hard-coded previous release.
          BASE="https://${GITHUB_HEAD_REF//\//-}-signal-scout.james-methvin74.workers.dev"
          # Limited retries allow Cloudflare Git integration time to deploy this PR commit.
          for i in 1 2 3 4 5; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || true)"
            if [[ "$code" == "200" ]]; then break; fi
            echo "Preview root pending: attempt $i HTTP $code"
            sleep 15
          done
          [[ "$code" == "200" ]] || { echo "FAIL: preview homepage not available (HTTP $code)"; exit 1; }
          # This file is removed only by the most recent .assetsignore patch.
          # Do not test an earlier Cloudflare commit while its async preview build catches up.
          ready=0
          for i in $(seq 1 24); do
            sentinel="$(curl -sS --retry 2 --retry-all-errors -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/sdr-diagnostics-worker.js" || true)"
            if [[ "$sentinel" == "404" ]]; then ready=1; break; fi
            echo "Awaiting latest diagnostic-block patch, attempt $i: HTTP $sentinel"
            sleep 8
          done
          [[ "$ready" == "1" ]] || { echo "FAIL: latest exclusion patch is not yet live on the preview"; exit 1; }
          blocked=(
            '/worker-program-v22.js' '/worker-base.js' '/security-hardening.js'
            '/receiver-health-d1.js' '/receiver-health-backfill.js'
            '/kiwi-public-directory.js' '/sdr-ws-router.js'
            '/sdr-forensics-v4.html' '/sdr-forensics-v4.js'
            '/sdr-diagnostics.html' '/sdr-diagnostics.js' '/sdr-diagnostics-query.js'
            '/sdr-diagnostics-worker.js' '/sdr-asset-check.html' '/sdr-trace.html' '/sdr-trace-v2.html'
            '/pwa-diagnostics.html' '/pwa-check/index.html'
            '/scripts/generate-global-terrestrial-catalog.mjs'
            '/tests/security-hardening.test.mjs' '/package.json'
            '/SOURCE-COMPLIANCE.md' '/wrangler.jsonc' '/.assetsignore'
          )
          failures=0
          for path in "${blocked[@]}"; do
            for method in GET HEAD; do
              status="$(curl -sS --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' --max-time 15 -X "$method" "$BASE$path" || true)"
              echo "BLOCKED $method $path -> HTTP $status"
              if [[ ! "$status" =~ ^(403|404|410)$ ]]; then failures=$((failures+1)); fi
            done
          done
          allowed=('/' '/index.html' '/explore.html' '/lookup.html' '/freqbeacon-zero.html' '/app.js' '/explore-page.js' '/sdr-player.js' '/full-data.js' '/favicon.svg')
          for path in "${allowed[@]}"; do
            status="$(curl -sS -L --proto-redir '=https' --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code} %{url_effective}' --max-time 15 "$BASE$path" || true)"
            code="${status%% *}"
            final_url="${status#* }"
            echo "PUBLIC GET $path -> HTTP $code at $final_url"
            if [[ "$code" != "200" || "$final_url" != "$BASE"* ]]; then failures=$((failures+1)); fi
          done
          if ((failures)); then echo "FAIL: $failures security/availability checks"; exit 1; fi
          echo "PASS: 48 blocked GET/HEAD requests and 10 core public routes"

  deployed-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Verify live production GET and HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm protected paths are blocked in production and public pages work
        env:
          BASE: https://freqbeacon.methvindigitalworks.com
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare Git integration may finish publishing after this GitHub push.
          for i in 1 2 3 4 5; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || true)"
            if [[ "$code" == "200" ]]; then break; fi
            echo "Preview root pending: attempt $i HTTP $code"
            sleep 15
          done
          [[ "$code" == "200" ]] || { echo "FAIL: preview homepage not available (HTTP $code)"; exit 1; }
          # This file is removed by this approved .assetsignore security release.
          # Do not treat the old production build as proof of the new deployment.
          ready=0
          for i in $(seq 1 24); do
            sentinel="$(curl -sS --retry 2 --retry-all-errors -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/sdr-diagnostics-worker.js" || true)"
            if [[ "$sentinel" == "404" ]]; then ready=1; break; fi
            echo "Awaiting production deployment of diagnostic-block patch, attempt $i: HTTP $sentinel"
            sleep 8
          done
          [[ "$ready" == "1" ]] || { echo "FAIL: new security release is not yet visible on production"; exit 1; }
          blocked=(
            '/worker-program-v22.js' '/worker-base.js' '/security-hardening.js'
            '/receiver-health-d1.js' '/receiver-health-backfill.js'
            '/kiwi-public-directory.js' '/sdr-ws-router.js'
            '/sdr-forensics-v4.html' '/sdr-forensics-v4.js'
            '/sdr-diagnostics.html' '/sdr-diagnostics.js' '/sdr-diagnostics-query.js'
            '/sdr-diagnostics-worker.js' '/sdr-asset-check.html' '/sdr-trace.html' '/sdr-trace-v2.html'
            '/pwa-diagnostics.html' '/pwa-check/index.html'
            '/scripts/generate-global-terrestrial-catalog.mjs'
            '/tests/security-hardening.test.mjs' '/package.json'
            '/SOURCE-COMPLIANCE.md' '/wrangler.jsonc' '/.assetsignore'
          )
          failures=0
          for path in "${blocked[@]}"; do
            for method in GET HEAD; do
              status="$(curl -sS --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' --max-time 15 -X "$method" "$BASE$path" || true)"
              echo "BLOCKED $method $path -> HTTP $status"
              if [[ ! "$status" =~ ^(403|404|410)$ ]]; then failures=$((failures+1)); fi
            done
          done
          allowed=('/' '/index.html' '/explore.html' '/lookup.html' '/freqbeacon-zero.html' '/app.js' '/explore-page.js' '/sdr-player.js' '/full-data.js' '/favicon.svg')
          for path in "${allowed[@]}"; do
            status="$(curl -sS -L --proto-redir '=https' --retry 3 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code} %{url_effective}' --max-time 15 "$BASE$path" || true)"
            code="${status%% *}"
            final_url="${status#* }"
            echo "PUBLIC GET $path -> HTTP $code at $final_url"
            if [[ "$code" != "200" || "$final_url" != "$BASE"* ]]; then failures=$((failures+1)); fi
          done
          if ((failures)); then echo "FAIL: $failures security/availability checks"; exit 1; fi
          echo "PASS: production 48 blocked GET/HEAD requests and 10 core public routes"

  api-preview:
    if: github.event_name == 'pull_request'
    name: Verify API default-deny and live cost guard (preview)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact release marker and test low-volume safe requests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://${GITHUB_HEAD_REF//\//-}-signal-scout.james-methvin74.workers.dev"
          ready=0
          # Cloudflare deployments finish asynchronously; old revisions cannot pass this gate.
          for i in $(seq 1 24); do
            headers="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -D - -o /dev/null "$BASE/api/unrecognized-security-proof" || true)"
            if printf '%s' "$headers" | tr -d '\r' | grep -qi '^x-freqbeacon-security-policy: api-cost-guard-v1$'; then
              ready=1
              break
            fi
            echo "Awaiting current security-policy marker ($i)"
            sleep 8
          done
          [[ "$ready" == "1" ]] || { echo "FAIL: expected deployed release marker absent"; exit 1; }
          errors=0
          check() {
            local method="$1" path="$2" expected="$3" type="${4:-}"
            local status
            if [[ -n "$type" ]]; then
              status="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -X "$method" -H "Content-Type: $type" -o /dev/null -w '%{http_code}' "$BASE$path" || true)"
            else
              status="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -X "$method" -o /dev/null -w '%{http_code}' "$BASE$path" || true)"
            fi
            echo "$method $path -> HTTP $status (expected $expected)"
            if [[ "$status" != "$expected" ]]; then errors=$((errors+1)); fi
          }
          check GET /api/unrecognized-security-proof 404
          check POST /api/unrecognized-security-proof 404
          check GET /api/explore/admin 404
          check GET /api/explore/refresh 404
          check GET /api/zero/admin 404
          check GET /api/sdr/diagnostics 404
          check POST /api/explore/status 405
          check POST /api/explore/live-failure 415 text/plain
          check GET /api/sdr/ws 426
          check GET /api/zero/bootstrap 200
          check GET /api/explore/status 200
          check GET /api/explore/receivers 200
          [[ "$errors" -eq 0 ]] || { echo "FAIL: $errors API route checks"; exit 1; }
          echo "PASS: 12 low-volume live API checks, exact release identity verified"

  api-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Verify API default-deny and live cost guard (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact release marker and test low-volume safe requests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://freqbeacon.methvindigitalworks.com"
          ready=0
          # Cloudflare deployments finish asynchronously; old revisions cannot pass this gate.
          for i in $(seq 1 24); do
            headers="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -D - -o /dev/null "$BASE/api/unrecognized-security-proof" || true)"
            if printf '%s' "$headers" | tr -d '\r' | grep -qi '^x-freqbeacon-security-policy: api-cost-guard-v1$'; then
              ready=1
              break
            fi
            echo "Awaiting current security-policy marker ($i)"
            sleep 8
          done
          [[ "$ready" == "1" ]] || { echo "FAIL: expected deployed release marker absent"; exit 1; }
          errors=0
          check() {
            local method="$1" path="$2" expected="$3" type="${4:-}"
            local status
            if [[ -n "$type" ]]; then
              status="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -X "$method" -H "Content-Type: $type" -o /dev/null -w '%{http_code}' "$BASE$path" || true)"
            else
              status="$(curl -sS --retry 2 --retry-all-errors --max-time 15 -X "$method" -o /dev/null -w '%{http_code}' "$BASE$path" || true)"
            fi
            echo "$method $path -> HTTP $status (expected $expected)"
            if [[ "$status" != "$expected" ]]; then errors=$((errors+1)); fi
          }
          check GET /api/unrecognized-security-proof 404
          check POST /api/unrecognized-security-proof 404
          check GET /api/explore/admin 404
          check GET /api/explore/refresh 404
          check GET /api/zero/admin 404
          check GET /api/sdr/diagnostics 404
          check POST /api/explore/status 405
          check POST /api/explore/live-failure 415 text/plain
          check GET /api/sdr/ws 426
          check GET /api/zero/bootstrap 200
          check GET /api/explore/status 200
          check GET /api/explore/receivers 200
          [[ "$errors" -eq 0 ]] || { echo "FAIL: $errors API route checks"; exit 1; }
          echo "PASS: 12 low-volume live API checks, exact release identity verified"
