<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a0d">
  <meta name="description" content="Identify a radio signal by frequency or browse real FREQBEACON station and service categories.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/lookup-page.css?v=4">
  <link rel="stylesheet" href="/lookup-scroll-fix.css?v=1">
  <title>Lookup — FREQBEACON Zero</title>
</head>
<body>
  <main class="lookup-app">
    <header class="lookup-header">
      <div class="lookup-brandline">
        <strong>FREQBEACON <span>Zero</span></strong>
        <i aria-hidden="true"></i>
        <small>CLEANROOM RECEIVER</small>
      </div>
      <div class="lookup-tagline">Explore the airwaves.</div>
      <div class="lookup-page-pill" aria-current="page">LOOKUP</div>
    </header>

    <section class="lookup-panel lookup-frequency-panel" aria-labelledby="frequencyLookupTitle">
      <h1 class="lookup-section-label" id="frequencyLookupTitle">FREQUENCY (kHz)</h1>
      <form id="lookupForm" class="lookup-form">
        <div class="lookup-input-shell">
          <input id="lookupFrequency" name="frequency" type="text" inputmode="decimal" autocomplete="off" placeholder="9955.000" aria-label="Frequency in kilohertz" aria-describedby="lookupStatus">
          <span>kHz</span>
        </div>
        <button class="lookup-clear" id="lookupClear" type="button" aria-label="Clear frequency">×</button>
        <button class="lookup-submit" type="submit">LOOK UP</button>
      </form>
      <div class="lookup-status" id="lookupStatus" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    <section class="lookup-panel lookup-browser" id="lookupCategoryBrowser" aria-labelledby="categoriesTitle">
      <h2 class="lookup-section-label" id="categoriesTitle">CATEGORIES</h2>
      <div class="lookup-category-chips" data-category-chips role="group" aria-label="Content and service categories">
        <button class="lookup-category-chip" type="button" data-category="news" aria-pressed="false">News</button>
        <button class="lookup-category-chip" type="button" data-category="sports" aria-pressed="false">Sports</button>
        <button class="lookup-category-chip" type="button" data-category="religious" aria-pressed="false">Religious</button>
        <button class="lookup-category-chip" type="button" data-category="propaganda" aria-pressed="false">Propaganda</button>
        <button class="lookup-category-chip" type="button" data-category="international" aria-pressed="false">International</button>
        <button class="lookup-category-chip" type="button" data-category="utility" aria-pressed="false">Utility</button>
        <button class="lookup-category-chip" type="button" data-category="amateur-voice" aria-pressed="false">Amateur<br>Voice</button>
        <button class="lookup-category-chip" type="button" data-category="digital" aria-pressed="false">Digital</button>
        <button class="lookup-category-chip" type="button" data-category="aviation" aria-pressed="false">Aviation</button>
        <button class="lookup-category-chip" type="button" data-category="cb" aria-pressed="false">CB</button>
      </div>
    </section>

    <section class="lookup-results-shell" aria-labelledby="lookupResultsTitle">
      <div class="lookup-results-head">
        <h2 class="lookup-section-label" id="lookupResultsTitle">LOOKUP RESULTS</h2>
        <span id="lookupResultCount"></span>
      </div>
      <div class="lookup-stage" id="lookupResults" aria-live="polite">
        <div class="lookup-empty">
          <strong>Enter a frequency or choose a category.</strong>
          <p>FREQBEACON will use its real identification catalog and schedule data to show the best matches.</p>
        </div>
      </div>
    </section>

    <nav class="lookup-bottom-nav" aria-label="Primary">
      <a class="lookup-nav-item" href="/zero" aria-label="Radio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M8.5 7.5a6 6 0 0 0 0 9M15.5 7.5a6 6 0 0 1 0 9M5.5 5a10 10 0 0 0 0 14M18.5 5a10 10 0 0 1 0 14"/></svg>
        <span>Radio</span>
      </a>
      <a class="lookup-nav-item" href="/explore" aria-label="Explore">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"/></svg>
        <span>Explore</span>
      </a>
      <a class="lookup-nav-item active" href="/lookup.html" aria-current="page" aria-label="Lookup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <span>Lookup</span>
      </a>
      <a class="lookup-nav-item" href="/?band=HAM" aria-label="Ham">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15c2.2-4 4.4-4 6.6 0s4.4 4 6.6 0S20 11 20 11"/><path d="M4 8h16"/></svg>
        <span>Ham</span>
      </a>
    </nav>
  </main>

  <script src="/freqbeacon-zero-am-catalog.js?v=1"></script>
  <script src="/stations.js?v=1"></script>
  <script src="/ham-bands.js?v=1"></script>
  <script src="/freqbeacon-zero-identification-data.js?v=3"></script>
  <script src="/freqbeacon-identification-engine.js?v=2"></script>
  <script src="/lookup-category-browser.js?v=3"></script>
  <script src="/lookup-page.js?v=2"></script>
  <script src="/program-guide.js?v=3"></script>
</body>
</html>
