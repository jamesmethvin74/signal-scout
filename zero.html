<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0d">
  <title>FREQBEACON ZERO</title>
  <link rel="stylesheet" href="/zero.css?v=1">
</head>
<body>
  <main class="radio" aria-label="FREQBEACON experimental tuner">
    <header class="mast">
      <div class="wordmark"><b>FREQ</b><span>BEACON</span></div>
      <div class="lab">ZERO / RECEIVER LAB</div>
      <button class="power" id="power" type="button" aria-pressed="false"><i></i><span>START</span></button>
    </header>

    <section class="instrument">
      <div class="status-rail" aria-label="Receiver state">
        <span>SND <i id="sndLamp"></i></span>
        <span>W/F <i id="wfLamp"></i></span>
        <span>NET <i id="netLamp"></i></span>
      </div>

      <div class="frequency-stage">
        <div class="band-label" id="bandLabel">40 METER / VOICE</div>
        <div class="frequency-line">
          <button class="step" type="button" data-step="-1" aria-label="Tune down">−</button>
          <div class="frequency" id="frequency" aria-live="polite">7.200<span>MHz</span></div>
          <button class="step" type="button" data-step="1" aria-label="Tune up">+</button>
        </div>
        <div class="mode-strip" role="group" aria-label="Mode">
          <button type="button" data-mode="am">AM</button>
          <button type="button" data-mode="lsb" class="active">LSB</button>
          <button type="button" data-mode="usb">USB</button>
          <button type="button" data-mode="sam">SAM</button>
        </div>
      </div>

      <section class="scope" aria-label="RF spectrum and waterfall">
        <canvas id="scopeCanvas"></canvas>
        <div class="scope-state" id="scopeState"><b>RF OFF</b><span>Start the receiver to open the airwaves.</span></div>
        <div class="cursor" aria-hidden="true"></div>
      </section>

      <div class="tape" id="tape" aria-label="Drag left or right to tune" tabindex="0">
        <div class="ticks" id="ticks"></div>
        <div class="needle"></div>
        <div class="tape-caption"><span id="leftFreq">7.185</span><b>DRAG TO TUNE</b><span id="rightFreq">7.215</span></div>
      </div>

      <footer class="deck">
        <div class="meter">
          <span>S</span><div class="meter-track"><i id="meterBar"></i></div><output id="meterValue">-- dB</output>
        </div>
        <div class="receiver-readout">
          <small>RECEIVER</small>
          <strong id="receiverName">UNASSIGNED</strong>
        </div>
        <button class="audio" id="mute" type="button" aria-pressed="false"><span>◖)))</span> AUDIO</button>
      </footer>
    </section>

    <p class="build-note">Greenfield tuner. No legacy SDR modules are loaded on this page.</p>
  </main>
  <script type="module" src="/zero.js?v=1"></script>
</body>
</html>
