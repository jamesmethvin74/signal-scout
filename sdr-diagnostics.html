<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>FREQBEACON SDR Diagnostics</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf7ff;font:14px/1.45 system-ui,-apple-system,sans-serif;padding:18px}.wrap{max-width:820px;margin:auto}.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.mark{width:52px;height:52px;border-radius:13px;background:url('/freqbeacon-icon-v3-192.webp') center/cover}.title{font-size:18px;font-weight:950;letter-spacing:.07em}.sub{color:#7ddcff;font-size:12px}.card{background:#0d2134;border:1px solid #214662;border-radius:16px;padding:14px;margin:12px 0}.section{font-size:13px;font-weight:900;color:#7ddcff;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}.row{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(0,1.6fr);gap:12px;padding:8px 0;border-bottom:1px solid #17344b}.row:last-child{border-bottom:0}.k{color:#a9bed0}.v{font-weight:750;word-break:break-word}.ok{color:#69e78e}.bad{color:#ff7474}.warn{color:#ffd166}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.summary{font-size:18px;font-weight:950}.small{font-size:12px;color:#90a9bc}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{padding:13px;border:1px solid #2b678e;border-radius:12px;background:#123550;color:#fff;font-weight:850}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c7d8e6}@media(max-width:560px){.row{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.v{text-align:left}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="mark"></div><div><div class="title">FREQBEACON SDR DIAGNOSTICS</div><div class="sub">Production runtime · receiver directory · Android/PWA cache truth</div></div></div>
  <div class="card"><div id="summary" class="summary">Running checks…</div><div class="small">This page is isolated from the receiver chooser and will not open SDR audio or WebSockets.</div></div>
  <div id="environment" class="card"><div class="section">Device / PWA</div></div>
  <div id="runtime" class="card"><div class="section">Production app runtime</div></div>
  <div id="directory" class="card"><div class="section">Receiver directory</div></div>
  <div id="reportCard" class="card"><div class="section">Copyable report</div><pre id="report">Building report…</pre></div>
  <div class="buttons"><button id="run">Run again</button><button id="copy">Copy diagnostics</button></div>
</div>
<script>
(() => {
  const VERSION = 'sdr-diag-v2';
  const EXPECTED = {
    receiverUi: 'sdr-receiver-ui.js?v=5',
    optionsFix: 'sdr-options-fix.js?v=4',
    directoryHeader: 'fast-fallback-v1'
  };
  const report = [];
  const $ = id => document.getElementById(id);
  const clearSection = id => {
    const el=$(id); [...el.querySelectorAll('.row')].forEach(n=>n.remove()); return el;
  };
  function add(section,key,value,state=''){
    const el=$(section); const row=document.createElement('div'); row.className='row';
    const k=document.createElement('div'); k.className='k'; k.textContent=key;
    const v=document.createElement('div'); v.className='v '+state; v.textContent=String(value);
    row.append(k,v); el.appendChild(row); report.push(`${key}: ${value}`);
  }
  function storedLocation(){
    try{const p=JSON.parse(localStorage.getItem('signalScout:location:v1')||'null'); const lat=Number(p?.lat),lon=Number(p?.lon); return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon}:null;}catch{return null;}
  }
  async function fetchText(url,timeout=6500){
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),timeout); const start=performance.now();
    try{const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:c.signal}); const text=await r.text(); return {r,text,ms:Math.round(performance.now()-start)};}finally{clearTimeout(t);}
  }
  async function fetchJson(url,timeout=6500){
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),timeout); const start=performance.now();
    try{const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json','Cache-Control':'no-cache'},signal:c.signal}); const text=await r.text(); let json=null; try{json=JSON.parse(text);}catch{} return {r,json,text,ms:Math.round(performance.now()-start)};}finally{clearTimeout(t);}
  }
  function scriptSrc(html,name){
    const re=new RegExp(`<script[^>]+src=["']([^"']*${name}[^"']*)["']`,'i'); return html.match(re)?.[1]||'NOT FOUND';
  }
  async function run(){
    report.length=0; ['environment','runtime','directory'].forEach(clearSection); $('summary').textContent='Running checks…'; $('summary').className='summary';
    report.push(`FREQBEACON SDR diagnostics ${VERSION}`); report.push(`UTC: ${new Date().toISOString()}`);
    add('environment','Diagnostic version',VERSION,'ok');
    add('environment','Origin',location.origin,location.protocol==='https:'?'ok':'bad');
    add('environment','User agent',navigator.userAgent,'mono');
    add('environment','Display mode',matchMedia('(display-mode: standalone)').matches?'standalone/PWA':'browser','');
    add('environment','Online',navigator.onLine?'YES':'NO',navigator.onLine?'ok':'bad');
    const loc=storedLocation(); add('environment','Stored app location',loc?'FOUND (used for API test)':'NOT FOUND',loc?'ok':'warn');
    if('serviceWorker' in navigator){
      try{const reg=await navigator.serviceWorker.getRegistration('/'); add('environment','Service worker registration',reg?'FOUND':'NONE',reg?'warn':'ok'); add('environment','Page controlled by SW',navigator.serviceWorker.controller?.scriptURL||'NO',navigator.serviceWorker.controller?'warn':'ok');}catch(e){add('environment','Service worker check',e.name+': '+e.message,'warn');}
    }

    let runtimeBad=false;
    try{
      const root=await fetchText('/?sdrdiag='+Date.now());
      add('runtime','App HTML HTTP',`${root.r.status} in ${root.ms} ms`,root.r.ok?'ok':'bad');
      add('runtime','x-freqbeacon-brand',root.r.headers.get('x-freqbeacon-brand')||'MISSING',(root.r.headers.get('x-freqbeacon-brand')?'ok':'warn'));
      add('runtime','x-signal-scout-sdr-runtime',root.r.headers.get('x-signal-scout-sdr-runtime')||'MISSING',(root.r.headers.get('x-signal-scout-sdr-runtime')?'ok':'warn'));
      add('runtime','x-freqbeacon-receiver-ui',root.r.headers.get('x-freqbeacon-receiver-ui')||'MISSING',(root.r.headers.get('x-freqbeacon-receiver-ui')?'ok':'warn'));
      const uiSrc=scriptSrc(root.text,'sdr-receiver-ui.js'); add('runtime','HTML receiver UI script',uiSrc,uiSrc.includes('v=5')?'ok':'bad'); if(!uiSrc.includes('v=5')) runtimeBad=true;
      const playerSrc=scriptSrc(root.text,'sdr-player.js'); add('runtime','HTML SDR player script',playerSrc,playerSrc!=='NOT FOUND'?'ok':'bad');
    }catch(e){add('runtime','App HTML fetch',e.name+': '+e.message,'bad'); runtimeBad=true;}

    try{
      const ui=await fetchText('/sdr-receiver-ui.js?diag='+Date.now());
      add('runtime','Receiver UI HTTP',`${ui.r.status} in ${ui.ms} ms`,ui.r.ok?'ok':'bad');
      const pointsV4=ui.text.includes(EXPECTED.optionsFix); add('runtime','Receiver UI points to options v4',pointsV4?'YES':'NO',pointsV4?'ok':'bad'); if(!pointsV4) runtimeBad=true;
    }catch(e){add('runtime','Receiver UI fetch',e.name+': '+e.message,'bad'); runtimeBad=true;}

    try{
      const fix=await fetchText('/sdr-options-fix.js?diag='+Date.now());
      add('runtime','Options fix HTTP',`${fix.r.status} in ${fix.ms} ms`,fix.r.ok?'ok':'bad');
      const hasObserver=/new\s+MutationObserver\s*\(/.test(fix.text); add('runtime','Chooser MutationObserver present',hasObserver?'YES — stale/unsafe':'NO',hasObserver?'bad':'ok'); if(hasObserver) runtimeBad=true;
      const bounded=fix.text.includes('requestAnimationFrame')&&fix.text.includes('polishChooser'); add('runtime','Bounded chooser polish present',bounded?'YES':'NO',bounded?'ok':'warn');
      const hiddenLookupSubmit=fix.text.includes('submit.click()')||fix.text.includes('lookupSubmit')&&fix.text.includes('.click()'); add('runtime','Hidden Lookup submit on Receiver options',hiddenLookupSubmit?'YES — stale path':'NO',hiddenLookupSubmit?'bad':'ok'); if(hiddenLookupSubmit) runtimeBad=true;
      const directContext=fix.text.includes('prepareReceiverContext')&&fix.text.includes('Open the existing smart chooser directly'); add('runtime','Direct Receiver options path present',directContext?'YES':'NO',directContext?'ok':'bad'); if(!directContext) runtimeBad=true;
    }catch(e){add('runtime','Options fix fetch',e.name+': '+e.message,'bad'); runtimeBad=true;}

    let directoryBad=false;
    const params=new URLSearchParams({frequency:'9955.0'}); if(loc){params.set('lat',loc.lat.toFixed(5));params.set('lon',loc.lon.toFixed(5));}
    for(let i=1;i<=2;i++){
      try{
        const d=await fetchJson('/api/sdr/receivers?'+params+'&diag='+Date.now());
        const count=Array.isArray(d.json?.receivers)?d.json.receivers.length:0;
        const source=d.json?.source||'MISSING'; const marker=d.r.headers.get('x-freqbeacon-sdr-directory')||'MISSING';
        add('directory',`API run ${i}`,`${d.r.status} · ${d.ms} ms · ${count} receivers`,d.r.ok&&count>3?'ok':'bad');
        add('directory',`API run ${i} source`,source,count>3?'ok':'bad');
        add('directory',`API run ${i} fast-fallback header`,marker,marker===EXPECTED.directoryHeader?'ok':'warn');
        if(d.json?.warning) add('directory',`API run ${i} warning`,d.json.warning,'warn');
        const names=(d.json?.receivers||[]).slice(0,7).map(x=>x.name||x.location||x.id).join(' | '); if(names)add('directory',`API run ${i} first choices`,names,'mono');
        if(!d.r.ok||count<=3) directoryBad=true;
      }catch(e){add('directory',`API run ${i}`,e.name+': '+e.message,'bad'); directoryBad=true;}
    }

    if(runtimeBad){$('summary').textContent='FAIL: production runtime is not serving the expected receiver-option fix'; $('summary').className='summary bad';}
    else if(directoryBad){$('summary').textContent='FAIL: receiver directory request is still failing on this device'; $('summary').className='summary bad';}
    else{$('summary').textContent='PASS: direct Receiver options runtime is loaded and receiver API returns >3 choices'; $('summary').className='summary ok';}
    $('report').textContent=report.join('\n');
  }
  $('run').addEventListener('click',run);
  $('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('report').textContent);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy diagnostics',1200);}catch{$('copy').textContent='Copy failed';}});
  run();
})();
</script>
</body>
</html>
