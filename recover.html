<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>FREQBEACON Recovery</title>
  <style>
    :root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#07111f;color:#eef8ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:28px;box-sizing:border-box}.card{width:min(440px,100%);text-align:center}.name{font-size:28px;font-weight:900;letter-spacing:.14em}.tag{margin-top:8px;color:#63d9ff;font-size:18px}.status{margin-top:34px;color:#b8cad8;line-height:1.55;font-size:17px}.detail{margin-top:12px;color:#7290a5;font-size:14px}.button{display:none;margin:28px auto 0;border:1px solid #44d8ff;background:#0d2635;color:#eef8ff;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:800;text-decoration:none}.button.show{display:inline-block}.dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#44d8ff;box-shadow:0 0 18px #44d8ff}
  </style>
</head>
<body>
  <main class="card">
    <div class="name">FREQBEACON</div>
    <div class="tag">Explore the airwaves.</div>
    <div class="status" id="status"><span class="dot"></span>Repairing the Android app cache…</div>
    <div class="detail" id="detail">Removing stale service-worker and cached app-shell state.</div>
    <a class="button" id="open" href="/">Open FREQBEACON</a>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const open = document.getElementById('open');
      try {
        let registrations = [];
        if ('serviceWorker' in navigator) {
          registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.allSettled(registrations.map((registration) => registration.unregister()));
        }

        let cacheNames = [];
        if ('caches' in window) {
          cacheNames = await caches.keys();
          const freqbeaconCaches = cacheNames.filter((name) => /freqbeacon|signal-scout/i.test(name));
          await Promise.allSettled(freqbeaconCaches.map((name) => caches.delete(name)));
        }

        status.textContent = 'Recovery complete.';
        detail.textContent = `Removed ${registrations.length} service-worker registration${registrations.length === 1 ? '' : 's'} and cleared FREQBEACON caches. Opening a clean copy…`;
        const cleanUrl = `/?recovered=${Date.now()}`;
        open.href = cleanUrl;
        open.classList.add('show');
        window.setTimeout(() => window.location.replace(cleanUrl), 700);
      } catch (error) {
        status.textContent = 'Recovery needs one more tap.';
        detail.textContent = error?.message || 'Android blocked the automatic reset.';
        open.href = `/?recovered=${Date.now()}`;
        open.classList.add('show');
      }
    })();
  </script>
</body>
</html>
