<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">FreqBeacon</title>
  <desc id="desc">Radio beacon tower with radiating signal waves</desc>
  <defs>
    <linearGradient id="mast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f1ff"/>
      <stop offset="1" stop-color="#69bdf4"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23.5 18.5a12 12 0 0 1 17 0" stroke="#72c9f7" stroke-width="2.2"/>
    <path d="M17 12a21.2 21.2 0 0 1 30 0" stroke="#5ebbf1" stroke-width="2" opacity=".9"/>
    <path d="M11 6a29.7 29.7 0 0 1 42 0" stroke="#4aaee9" stroke-width="1.8" opacity=".72"/>
    <path d="M26.5 22.3 17 58h30l-9.5-35.7" stroke="url(#mast)" stroke-width="3"/>
    <path d="M22 42h20M19.5 51h25M32 26v32" stroke="#8dd5fb" stroke-width="1.7" opacity=".86"/>
  </g>
  <circle cx="32" cy="20" r="4.2" fill="#cbedff" stroke="#76d6ff" stroke-width="1.4" filter="url(#glow)"/>
  <circle cx="32" cy="20" r="1.8" fill="#ffffff"/>
</svg>
