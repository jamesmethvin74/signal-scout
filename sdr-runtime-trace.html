<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07111f" />
<title>FREQBEACON SDR Runtime Trace</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf7ff;font:14px/1.45 system-ui,-apple-system,sans-serif;padding:16px}.wrap{max-width:900px;margin:auto}.head{font-weight:950;font-size:19px;letter-spacing:.05em}.sub{color:#7ddcff;margin:3px 0 14px}.card{background:#0d2134;border:1px solid #214662;border-radius:15px;padding:13px;margin:10px 0}.title{font-size:12px;font-weight:950;color:#7ddcff;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}.ok{color:#69e78e}.bad{color:#ff7474}.warn{color:#ffd166}.row{padding:7px 0;border-bottom:1px solid #17344b}.row:last-child{border:0}.k{color:#9eb6c9}.v{font-weight:750;word-break:break-word}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}button{padding:13px;border-radius:11px;border:1px solid #2b678e;background:#123550;color:#fff;font-weight:850}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:11px/1.48 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c7d8e6}.summary{font-size:16px;font-weight:900}.small{font-size:12px;color:#91a8ba}@media(max-width:560px){.buttons{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="head">FREQBEACON SDR RUNTIME TRACE</div><div class="sub">Forensic trace for Receiver options · trace-v1</div>
<div class="card"><div id="summary" class="summary">Reading trace…</div><div class="small">Reproduce the Receiver options problem in FREQBEACON first, then open this page. The trace survives a hang or navigation.</div></div>
<div class="card"><div class="title">Runtime verdict</div><div id="verdict"></div></div>
<div class="card"><div class="title">Production runtime</div><div id="runtime"></div></div>
<div class="card"><div class="title">Receiver options trace</div><pre id="trace">No trace yet.</pre></div>
<div class="buttons"><button id="refresh">Read trace again</button><button id="copy">Copy full report</button><button id="clear">Clear trace</button><button id="api">Test receiver API now</button></div>
</div>
<script>
(() => {
const KEY='freqbeacon:sdr-runtime-trace:v1';
const report=[];
const $=id=>document.getElementById(id);
function row(parent,key,value,state=''){const d=document.createElement('div');d.className='row';d.innerHTML=`<div class="k"></div><div class="v ${state}"></div>`;d.children[0].textContent=key;d.children[1].textContent=String(value);parent.appendChild(d);report.push(`${key}: ${value}`);}
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}
function detail(entry){return entry?.detail&&typeof entry.detail==='object'?entry.detail:{}}
function after(entries,index,name){return entries.slice(index+1).find(e=>e.event===name)}
function anyAfter(entries,index,names){return entries.slice(index+1).find(e=>names.includes(e.event))}
async function runtime(){const box=$('runtime');box.innerHTML='';try{const r=await fetch('/?tracecheck='+Date.now(),{cache:'no-store'});const h=await r.text();const player=h.match(/sdr-player\.js\?v=\d+/)?.[0]||'NOT FOUND';const ui=h.match(/sdr-receiver-ui\.js\?v=\d+/)?.[0]||'NOT FOUND';const tr=h.match(/sdr-runtime-trace\.js\?v=\d+/)?.[0]||'NOT FOUND';row(box,'HTML HTTP',r.status,r.ok?'ok':'bad');row(box,'Receiver runtime marker',r.headers.get('x-freqbeacon-receiver-ui')||'MISSING',(r.headers.get('x-freqbeacon-receiver-ui')==='runtime-trace-v1')?'ok':'bad');row(box,'SDR player',player,player==='sdr-player.js?v=3'?'ok':'bad');row(box,'Receiver UI',ui,ui==='sdr-receiver-ui.js?v=6'?'ok':'bad');row(box,'Trace script',tr,tr==='sdr-runtime-trace.js?v=1'?'ok':'bad');}catch(e){row(box,'Runtime fetch',e.name+': '+e.message,'bad')}}
function analyze(){report.length=0;const entries=read();const verdict=$('verdict');verdict.innerHTML='';report.push(`FREQBEACON SDR runtime trace report`);report.push(`UTC: ${new Date().toISOString()}`);report.push(`Entries: ${entries.length}`);
const lastTrusted=entries.map((e,i)=>({e,i})).filter(x=>x.e.event==='receiver-click-capture'&&detail(x.e).isTrusted).pop();
row(verdict,'Trace entries',entries.length,entries.length?'ok':'warn');
if(!lastTrusted){row(verdict,'Last real Receiver options tap','NOT RECORDED — reproduce once, then return here','warn');$('summary').textContent='No instrumented Receiver options tap has been recorded yet.';$('summary').className='summary warn';$('trace').textContent=entries.map(e=>JSON.stringify(e)).join('\n');return;}
const i=lastTrusted.i;const click=lastTrusted.e;const prevented=after(entries,i,'options-card-click-prevented')||after(entries,i,'receiver-click-after-microtask');const context=after(entries,i,'options-context-prepared');const fetchStart=after(entries,i,'receiver-fetch-start');const fetchResponse=after(entries,i,'receiver-fetch-response');const fetchBody=after(entries,i,'receiver-fetch-body');const nav=anyAfter(entries,i,['beforeunload','pagehide','hashchange','popstate','history-pushState','history-replaceState']);const snap=entries.slice(i+1).filter(e=>e.event.startsWith('receiver-click-snapshot-')).pop();
row(verdict,'Tapped element',JSON.stringify(detail(click).button||{}),'');
row(verdict,'Default navigation prevented',detail(prevented).defaultPrevented===true?'YES':prevented?.event==='options-card-click-prevented'?'YES':'NO / NOT PROVEN',(detail(prevented).defaultPrevented===true||prevented?.event==='options-card-click-prevented')?'ok':'bad');
row(verdict,'Frequency context prepared',context?`YES · ${detail(context).frequency} kHz`:'NO',context?'ok':'bad');
row(verdict,'Receiver API called after tap',fetchStart?'YES':'NO',fetchStart?'ok':'bad');
row(verdict,'Receiver API response',fetchResponse?`${detail(fetchResponse).status} in ${detail(fetchResponse).ms} ms`:'NONE',fetchResponse&&detail(fetchResponse).status===200?'ok':'bad');
row(verdict,'API receiver payload',fetchBody?`${detail(fetchBody).receiverCount} receivers · ${detail(fetchBody).source||'no source'}`:'NONE',fetchBody&&detail(fetchBody).receiverCount>3?'ok':'bad');
row(verdict,'Navigation/reload signal after tap',nav?`${nav.event} @ ${nav.t}`:'NONE',nav?'bad':'ok');
row(verdict,'Final chooser snapshot',snap?`${detail(snap).choiceCount} choices · hidden=${detail(snap).chooserHidden}`:'NONE',snap&&detail(snap).choiceCount>3?'ok':'bad');
if(fetchBody&&detail(fetchBody).receiverCount>3&&snap&&detail(snap).choiceCount<=3){$('summary').textContent='CAUGHT: API returned a full list, but the chooser rendered the legacy three. Client state/render handoff is the failure.';$('summary').className='summary bad';}
else if(!fetchStart){$('summary').textContent='CAUGHT: Receiver options never called the receiver API. The click/context path is failing before ranking.';$('summary').className='summary bad';}
else if(nav){$('summary').textContent='CAUGHT: Receiver options is causing a real navigation/reload signal. The white loading bar is explained.';$('summary').className='summary bad';}
else if(fetchBody&&detail(fetchBody).receiverCount<=3){$('summary').textContent='CAUGHT: the live click path itself received only fallback receivers from the API.';$('summary').className='summary bad';}
else{$('summary').textContent='Trace captured. Copy the report; the exact event sequence is below.';$('summary').className='summary warn';}
const slice=entries.slice(Math.max(0,i-5));$('trace').textContent=slice.map(e=>`${e.t} +${e.p}ms ${e.event} ${JSON.stringify(e.detail||{})}`).join('\n');report.push('');report.push('TRACE:');report.push($('trace').textContent);}
async function run(){analyze();await runtime();}
$('refresh').onclick=run;$('clear').onclick=()=>{localStorage.removeItem(KEY);run()};$('copy').onclick=async()=>{await navigator.clipboard.writeText(report.join('\n'));$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy full report',1000)};$('api').onclick=async()=>{try{const loc=JSON.parse(localStorage.getItem('signalScout:location:v1')||'null');const p=new URLSearchParams({frequency:'9955.0',diag:String(Date.now())});if(Number.isFinite(Number(loc?.lat))&&Number.isFinite(Number(loc?.lon))){p.set('lat',Number(loc.lat).toFixed(5));p.set('lon',Number(loc.lon).toFixed(5));}const s=performance.now();const r=await fetch('/api/sdr/receivers?'+p,{cache:'no-store'});const j=await r.json();alert(`${r.status} · ${Math.round(performance.now()-s)} ms · ${(j.receivers||[]).length} receivers · ${j.source||'no source'}`);}catch(e){alert(e.name+': '+e.message)}};run();
})();
</script></body></html>
